apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
        template: flask-api
    spec:
      containers:
      - name: flask-api
        image: jktestacr.azurecr.io/app1/flask-api:371fde89daca32327daaffbf73d92a34b31811e6
        ports:
        - containerPort: 5000