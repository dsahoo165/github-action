apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
        template: flask-api
    spec:
      containers:
      - name: flask-api
        image: jktestacr.azurecr.io/app1/flask-api:c7dee1d51e091d7254ddce49d252bb18e8ccdf6c
        ports:
        - containerPort: 5000